<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CAB Change Analysis Review wireframe</title>
  <desc id="desc">Synthetic operator review screen showing aggregate review state, evidence gap, CAB question, trace, and human review actions.</desc>
  <rect width="1200" height="760" fill="#f5f7fb"/>
  <rect x="40" y="30" width="1120" height="700" rx="14" fill="white" stroke="#cbd5e1"/>
  <text x="70" y="70" font-family="Arial" font-size="14" fill="#475569">DECISION SUPPORT ONLY</text>
  <text x="70" y="108" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">CAB Change Analysis Review</text>
  <rect x="70" y="130" width="1060" height="48" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="90" y="160" font-family="Arial" font-size="15" fill="#9a3412">Accepted for CAB is supporting material for human discussion. It does not approve the change.</text>
  <rect x="70" y="205" width="1060" height="105" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="90" y="235" font-family="Arial" font-size="13" fill="#64748b">AGGREGATE REVIEW STATE</text>
  <text x="90" y="275" font-family="Arial" font-size="30" font-weight="700" fill="#b45309">AR2</text>
  <text x="250" y="235" font-family="Arial" font-size="13" fill="#64748b">LIFECYCLE</text>
  <text x="250" y="275" font-family="Arial" font-size="20" fill="#0f172a">ANALYSIS_GENERATED</text>
  <text x="650" y="235" font-family="Arial" font-size="13" fill="#64748b">ROLLBACK READINESS</text>
  <text x="650" y="275" font-family="Arial" font-size="18" fill="#0f172a">Additional evidence required</text>
  <text x="70" y="350" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Risk observation</text>
  <rect x="70" y="370" width="1060" height="65" rx="8" fill="white" stroke="#cbd5e1"/>
  <rect x="90" y="389" width="42" height="26" rx="13" fill="#fef3c7"/>
  <text x="102" y="407" font-family="Arial" font-size="13" font-weight="700" fill="#92400e">E2</text>
  <text x="155" y="407" font-family="Arial" font-size="15" fill="#0f172a">Billing dependency validation is not documented.</text>
  <text x="820" y="407" font-family="Arial" font-size="13" fill="#475569">deterministic · RULE:DEP-001</text>
  <text x="70" y="475" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">CAB question</text>
  <rect x="70" y="495" width="1060" height="55" rx="8" fill="white" stroke="#cbd5e1"/>
  <text x="90" y="529" font-family="Arial" font-size="15" fill="#0f172a">Is Billing dependency validation documented before CAB review?</text>
  <text x="70" y="590" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Reviewer actions</text>
  <rect x="70" y="610" width="1060" height="45" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="90" y="639" font-family="Arial" font-size="14" fill="#334155">Comment   Edit   Request evidence   Send back   Discard</text>
  <rect x="900" y="614" width="200" height="36" rx="6" fill="#1d4ed8"/>
  <text x="936" y="638" font-family="Arial" font-size="14" font-weight="700" fill="white">Accept for CAB</text>
</svg>
